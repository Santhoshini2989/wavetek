<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaveTek Navbar (Phantom Style)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons (CDN for vanilla HTML) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: { DEFAULT: '#4338CA' },
                        cyan: { DEFAULT: '#06B6D4' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F5F5F7;
        }
    </style>
</head>

<body class="min-h-screen">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 w-full z-50 h-20 transition-all duration-300 bg-transparent">
        <div class="max-w-7xl mx-auto px-6 h-full flex items-center justify-between">

            <!-- Left: Brand -->
            <div class="flex items-center gap-2">
                <div class="p-2 bg-indigo-50 rounded-lg text-[#4338CA]">
                    <i data-lucide="waves" class="w-6 h-6"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-900">
                    WaveTek
                </span>
            </div>

            <!-- Center: The Menu Pill (Phantom Style) -->
            <div class="hidden md:flex items-center bg-white rounded-full px-8 py-3 shadow-sm border border-slate-100">
                <div class="flex items-center space-x-8">
                    <a href="#features"
                        class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors duration-200">Features</a>
                    <a href="#staking"
                        class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors duration-200">Staking</a>
                    <a href="#roadmap"
                        class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors duration-200">Roadmap</a>
                </div>
            </div>

            <!-- Right: CTA & Search -->
            <div class="hidden md:flex items-center gap-4">
                <button
                    class="p-3 bg-white rounded-full text-slate-600 hover:text-slate-900 shadow-sm border border-slate-100 transition-all duration-200 hover:scale-105">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>

                <button
                    class="px-6 py-3 rounded-full bg-[#4338CA] text-white text-sm font-bold shadow-lg shadow-indigo-500/20 hover:bg-indigo-700 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 cursor-pointer">
                    Launch App
                </button>
            </div>

            <!-- Mobile Menu Button -->
            <div class="md:hidden">
                <button class="text-slate-900 focus:outline-none p-2 bg-white rounded-full shadow-sm">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Content for scrolling -->
    <div class="pt-32 px-6 max-w-7xl mx-auto space-y-20">
        <h1 class="text-4xl font-bold text-slate-900">Phantom Style Verification</h1>
        <div class="h-96 bg-indigo-100 rounded-lg"></div>
        <div class="h-96 bg-cyan-100 rounded-lg"></div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
